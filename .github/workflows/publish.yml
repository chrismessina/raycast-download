name: Publish Package

# Mirrors chrismessina/raycast-logger's publish.yml — same trigger, same idempotency
# guard — so both packages release the same way. Two additions: the test suite gates
# the publish, and the release tag must agree with package.json.
#
# Publishing is deliberately tied to a GitHub Release, NOT to a push to main. A merged
# docs commit should not mint an npm version, and a release is an explicit, reversible-
# up-to-that-point decision.

on:
  release:
    types: [created]

# Two releases racing would both pass the "is it published?" check and one would
# fail on a 403. Serialize instead.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    # macOS, not ubuntu: `package.json` declares `"os": ["darwin", "win32"]`
    # because Raycast only runs there, and `npm ci` enforces that field against
    # the ROOT package — so a Linux runner fails EBADPLATFORM before it can
    # install anything. Free for a public repo, and it builds the artifact on a
    # platform the package actually supports.
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # --ignore-scripts: a compromised transitive dependency's install hook must not
      # execute in this job at all. This package has zero runtime deps and its own
      # build is invoked explicitly below, so nothing legitimate needs a lifecycle hook.
      - run: npm ci --ignore-scripts

      # Build and test in TOKENLESS steps, before NODE_AUTH_TOKEN is ever in scope.
      # Anything that could tamper with dist/ runs here, where there is no credential
      # to steal; the publish step then ships the already-verified output.
      - run: npm run build
      # Deterministic gate only. The integration suite hits the real network, so
      # a registry hiccup during a release would otherwise block a publish that
      # has nothing to do with the outage. The network tests still run locally
      # and on ordinary `npm test`.
      - run: npm run test:unit

      # A tag that disagrees with package.json is how the wrong version gets published.
      # Compare them before touching the registry. Accepts `v0.1.1` or `0.1.1`.
      - name: Verify tag matches package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG'."
            echo "Bump package.json (npm version) or retag the release, then retry."
            exit 1
          fi
          echo "version $PKG matches tag $TAG"

      # Decide whether to publish BEFORE the token is in scope, and fail closed: a
      # transient registry error must not fall through to a publish attempt.
      - name: Check whether this version is already published
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published — will skip."
          elif npm view "$NAME" version >/dev/null 2>&1; then
            # Package exists, this version doesn't. Unambiguous: publish.
            echo "already=false" >> "$GITHUB_OUTPUT"
          elif npm view "$NAME" version 2>&1 | grep -q "E404"; then
            # Whole package is new (first publish).
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine publish state for $NAME@$VERSION (registry unreachable?). Refusing to publish blind."
            exit 1
          fi

      - name: Publish to npm
        if: steps.check.outputs.already == 'false'
        # --ignore-scripts here too: dist/ was built and tested in the tokenless steps
        # above, so prepublishOnly re-running is redundant — and running ANY script in
        # the one step that holds the credential is the thing worth avoiding.
        # --provenance publishes a signed attestation linking the tarball to this run.
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
